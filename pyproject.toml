[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-releem"
version = "0.1.0"
description = "Read-only Releem database diagnostics for MCP clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "httpx2==2.16.0", "pydantic==2.14.3", "python-dotenv==1.2.4", "starlette==1.10.0", "uvicorn==0.54.0"]

[project.scripts]
mcp-releem = "mcp_releem.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "hatchling==1.33.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_releem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

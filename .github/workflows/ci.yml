name: Verify private candidate
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2, verified with upstream git ls-remote.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run offline release checks
        run: bash scripts/check-release.sh
